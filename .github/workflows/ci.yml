name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    name: Линтер, типы, тесты
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Зависимости для проверок
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff>=0.14,<0.15" mypy pytest pytest-asyncio
          python -m pip install duckdb fastapi httpx pydantic pydantic-settings structlog typer
          # Runtime-дополнения GUI; SDK T-Invest импортируется лениво и для offline тестов не нужен.
          python -m pip install jinja2 python-multipart psutil sqlglot pytz keyring cryptography grpcio uvicorn
          python -m pip install --ignore-requires-python --extra-index-url https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple "t-tech-investments>=1.49.3,<2" || true
          python -m pip install numpy scipy scikit-learn catboost lightgbm

      - name: Ruff
        run: |
          ruff format .
          ruff check --fix . || true
          ruff check --output-format=github .
          ruff format --check .

      - name: Mypy (strict)
        run: |
          python -c '
          import re, subprocess, sys
          res = subprocess.run(["mypy"], text=True, capture_output=True)
          sys.stdout.write(res.stdout)
          sys.stderr.write(res.stderr)
          for line in res.stdout.splitlines():
              m = re.match(r"^([^:]+):(\d+): error: (.*)$", line)
              if m:
                  print(f"::error file={m.group(1)},line={m.group(2)}::{m.group(3)}")
          sys.exit(res.returncode)
          '

      - name: Тесты (без sandbox)
        env:
          REDBOT__TBANK__API_TOKEN: ci-placeholder
          REDBOT__TBANK__ACCOUNT_ID: ci-placeholder
        run: |
          python -c '
          import subprocess, sys
          res = subprocess.run(["pytest", "-m", "not sandbox", "-q", "--tb=short"], text=True, capture_output=True)
          sys.stdout.write(res.stdout)
          sys.stderr.write(res.stderr)
          if res.returncode != 0:
              msg = " | ".join(line.strip() for line in (res.stdout + "\n" + res.stderr).splitlines() if "FAILED" in line or "Error" in line or "assert" in line)[:900]
              print(f"::error file=tests/unit/test_synthetic_trader.py,line=1::{msg}")
          sys.exit(res.returncode)
          '
