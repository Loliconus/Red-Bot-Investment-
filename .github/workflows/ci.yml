name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    name: Линтер, типы, тесты
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Зависимости для проверок
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff>=0.14,<0.15" mypy pytest pytest-asyncio
          python -m pip install duckdb pytz fastapi httpx pydantic pydantic-settings structlog typer

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy (strict)
        run: mypy

      - name: Тесты (без sandbox)
        env:
          REDBOT__TBANK__API_TOKEN: ci-placeholder
          REDBOT__TBANK__ACCOUNT_ID: ci-placeholder
        run: pytest -m "not sandbox" -q
