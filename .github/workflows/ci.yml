name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.14 — safety, types, research
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mlops: [false, true]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.22"
          enable-cache: true
      - name: Locked dependencies (official SDK; no TLS bypass)
        run: |
          if [ "${{ matrix.mlops }}" = "true" ]; then
            uv sync --locked --extra mlops
          else
            uv sync --locked
          fi
          uv lock --check
      - name: Ruff / strict types / standalone dashboard JS
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
          .venv/bin/mypy
          node --check adapters/driving/web/static/js/research.js
      - name: Offline safety, causality, CV, frozen and SDK contracts — no orders
        env:
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
          PREFECT_SERVER_ANALYTICS_ENABLED: "false"
        run: .venv/bin/pytest -m "not sandbox and not e2e" -o addopts="" -q

  browser:
    name: GUI — Chromium / session / CSRF / research charts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.22"
          enable-cache: true
      - run: uv sync --locked
      - run: .venv/bin/playwright install --with-deps chromium
      - run: .venv/bin/pytest -m e2e -o addopts="" -q
