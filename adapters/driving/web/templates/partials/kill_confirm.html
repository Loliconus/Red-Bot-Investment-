{% if stopped %}<div class="inline-alert danger" role="alert">{{ message }}</div>{% else %}<div class="overlay force-visible" x-data="killConfirm()" x-init="init()" role="presentation"><div class="confirm-dialog danger-dialog" role="dialog" aria-modal="true" aria-label="Подтверждение остановки"><div class="dialog-warning">■</div><div class="eyebrow">ДЕЙСТВИЕ НЕОБРАТИМО ДО РУЧНОГО ЗАПУСКА</div><h3>Остановить торгового бота?</h3><p>Остановится планировщик, в том числе монитор открытых позиций. Убедитесь, что вы сможете контролировать позиции вручную.</p>{% if error %}<div class="inline-alert danger">{{ error }}</div>{% endif %}<form hx-post="/security/kill/confirm" hx-target="#kill-modal"><input type="hidden" name="nonce" value="{{ nonce }}"><label>Введите <strong>ОСТАНОВИТЬ</strong><input type="text" name="confirmation" required autocomplete="off" placeholder="ОСТАНОВИТЬ"></label><div class="dialog-actions"><button type="button" class="button secondary" x-on:click="$el.closest('#kill-modal').innerHTML = ''">Отмена</button><button type="submit" class="button danger" x-bind:disabled="seconds > 0">Подтвердить <span x-show="seconds > 0" x-text="'(' + seconds + ' с)'"></span></button></div></form></div></div>{% endif %}
