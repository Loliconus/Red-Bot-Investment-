<div class="job-list">
  {% for job in jobs %}
  <div class="job-row">
    <span class="job-icon {% if job.status == 'failed' %}danger{% elif job.status == 'done' %}success{% else %}working{% endif %}">
      {% if job.status == 'running' %}↻{% elif job.status == 'done' %}✓{% else %}×{% endif %}
    </span>
    <div><strong>{{ job.kind|upper }}</strong><small>{{ job.detail or 'Операция выполняется в фоне…' }}</small></div>
    <span class="pill {% if job.status == 'failed' %}danger{% elif job.status == 'done' %}success{% else %}neutral{% endif %}">{{ job.status|upper }}</span>
  </div>
  {% else %}
  <p class="empty-subtle">Фоновых операций нет.</p>
  {% endfor %}
</div>
