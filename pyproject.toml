[project]
name = "red-bot"
version = "0.3.0"
description = "Синтетический трейдер — вероятностные режимы MOEX, честная валидация и изолированный бэктест"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "MIT" }
authors = [{ name = "Red-Bot project" }]

dependencies = [
    # Официальный T-Bank registry; uv.lock фиксирует 1.51.0.
    # Не заменять SDK устаревшим пакетом из публичного PyPI.
    "t-tech-investments>=1.49.3,<2",

    "duckdb>=1.1",
    # DuckDB в некоторых сценариях использует pytz для преобразования TIMESTAMPTZ → datetime,
    # но не всегда явно тянет его как зависимость (фиксируем явно для предсказуемости окружения).
    "pytz>=2024.1",

    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "psutil>=5.9",
    "sqlglot>=26",

    "pydantic>=2.9",
    "pydantic-settings>=2.5",

    "structlog>=24",
    "keyring>=25",
    "typer>=0.12",

    "cryptography>=43",

    # SDK и так тянет grpcio транзитивно, но явный пин полезен для контроля совместимости.
    "grpcio>=1.68",

    # Проверены CPython 3.14 wheels / pure-Python контракты (2026-10-02).
    "numpy>=2.5.3,<3",
    "pandas>=3.0.6,<3.1",
    "scipy>=1.18.1,<2",
    "scikit-learn>=1.9.1,<2",
    "catboost==1.2.10",
    "aiomoex==2.2.0",
    "purgedcv==0.1.10",
    "arch>=8.0,<9",
    "osqp>=1.1.3,<2",
]

# -----------------------------------------------------------------------------
# Dev dependencies (uv / PEP 735)
# uv предпочитает dependency-groups (PEP 735) для локальных dev-зависимостей.
# Группа dev синкается по умолчанию при `uv sync` / `uv run`.
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "playwright>=1.50",
    "ruff>=0.14,<0.15",  # 0.15/0.16 ломали `except (A, B):` при форматировании — сознательно держим 0.14.x
    "mypy>=1.13",
    "pre-commit>=4",
]

# -----------------------------------------------------------------------------
# (Опционально) extras для совместимости с pip: `pip install -e ".[dev]"`
# Если вы используете только uv — этот блок можно удалить.
[project.optional-dependencies]
mlops = ["mlflow>=3.16,<4", "prefect>=3.8,<4"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "playwright>=1.50",
    "ruff>=0.14,<0.15",
    "mypy>=1.13",
    "pre-commit>=4",
]

[project.scripts]
# Основной CLI (как в README)
redbot = "adapters.driving.cli.main:app_cli"
# Алиас на случай привычки к старому имени
red-bot = "adapters.driving.cli.main:app_cli"

# -----------------------------------------------------------------------------
# uv: индекс T‑Bank только для t-tech-investments (остальное — из обычных индексов)
[[tool.uv.index]]
name = "tbank"
url = "https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple"
explicit = true

[tool.uv.sources]
t-tech-investments = { index = "tbank" }

# -----------------------------------------------------------------------------
# build (hatchling)
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "core", "application", "adapters", "src/synthetic_trader"]

# -----------------------------------------------------------------------------
# ruff
[tool.ruff]
line-length = 100
target-version = "py314"
src = [".", "src"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # flake8-bugbear
    "BLE",           # blind except
    "C4",            # flake8-comprehensions
    "SIM",           # flake8-simplify
    "ASYNC",         # async-correctness
    "RUF",           # ruff-specific
    "S",             # bandit (секреты, shell, eval)
    "SLF",           # обращение к приватным атрибутам
]
ignore = [
    "E501",     # длина строки — забота форматтера
    "B008",     # вызов в аргументах по умолчанию (используется в FastAPI Depends)
    "RUF002",   # кириллица в докстрингах — проект русскоязычный
    "RUF003",   # типографские символы (×, —) в комментариях — осознанный стиль
    "RUF001",   # типографские символы в строках — осознанный стиль
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "SLF001"]
"config/settings.py" = ["S105", "S106"]
"config/secrets_source.py" = ["S105", "S106"]
"adapters/driven/storage/*.py" = ["S608"]
"adapters/driven/backtest/replay_adapter.py" = ["S608"]
# AccountSelectionRequired — публичный контракт CLI/GUI, имя задокументировано с 0.1
"application/use_cases/select_account.py" = ["N818"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# -----------------------------------------------------------------------------
# mypy
[tool.mypy]
python_version = "3.14"
strict = true
files = ["config", "core", "application", "adapters", "src/synthetic_trader", "main.py"]
explicit_package_bases = true
mypy_path = ".:src"
warn_unreachable = false
show_error_codes = true
exclude = ["build", "dist", ".venv", "tests"]

[[tool.mypy.overrides]]
module = ["t_tech.*", "duckdb", "keyring", "typer", "uvicorn.*", "grpc", "grpc.*", "psutil", "pandas.*", "scipy.*", "sklearn.*", "catboost.*", "aiomoex.*", "purgedcv.*", "arch.*", "osqp.*", "mlflow.*", "prefect.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["synthetic_trader.*"]
disallow_untyped_calls = false

# -----------------------------------------------------------------------------
# pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "sandbox: сетевые тесты против контура песочницы T-Invest (не запускаются по умолчанию)",
    "contract: контрактные тесты, гоняемые против всех реализаций порта",
    "e2e: браузерные тесты с Playwright Chromium (если установлен)",
]
filterwarnings = ["ignore::DeprecationWarning"]