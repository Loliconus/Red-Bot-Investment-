[project]
name = "imoex-candles-collector"
version = "0.1.0"
description = "Сборщик свечей по инструментам IMOEX + сам индекс, через T-Invest API SDK (t-tech-investments)"
requires-python = ">=3.10"
dependencies = [
    "t-tech-investments>=1.49",
    "requests>=2.31",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "mplfinance>=0.12.10b0",
]

[[tool.uv.index]]
name = "tbank"
url = "https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple"

[tool.uv.sources]
t-tech-investments = { index = "tbank" }